name: Notificações Diárias e Sync
on:
  schedule:
    - cron: '0 12 * * *' # Todo dia às 12:00 UTC
  workflow_dispatch: # Permite disparo manual para testes

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install firebase-admin nodemailer
      - name: Run Automation Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: "djjeffinhothug@gmail.com"
        run: node scripts/automation.js

      - name: Run Storage Purge (30 Days)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_STORAGE_BUCKET: "blackstar-lancamentos.firebasestorage.app"
        run: node scripts/purge-media.js
